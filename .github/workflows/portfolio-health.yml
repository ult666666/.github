name: Public portfolio health audit

on:
  push:
    branches: [main]
    paths:
      - scripts/portfolio_health.py
      - tests/test_portfolio_health.py
      - .github/workflows/portfolio-health.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/portfolio_health.py
      - tests/test_portfolio_health.py
      - .github/workflows/portfolio-health.yml
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * 1'

permissions:
  contents: read

concurrency:
  group: public-portfolio-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Check the auditor with offline fixtures
        run: python3 -B -m unittest discover -s tests -p 'test_portfolio_health.py' -v

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Inventory public repositories without changing them
        run: python3 -B scripts/portfolio_health.py --owner ult666666 --output-dir audit-output
      - name: Save dated machine-readable and human-readable reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portfolio-health-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30

name: Public portfolio health audit

on:
  push:
    branches: [main]
    paths:
      - scripts/portfolio_health.py
      - tests/test_portfolio_health.py
      - .github/workflows/portfolio-health.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/portfolio_health.py
      - tests/test_portfolio_health.py
      - .github/workflows/portfolio-health.yml
  workflow_dispatch:
  schedule:
    - cron: '23 14 * * 1'

permissions:
  contents: read

concurrency:
  group: public-portfolio-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Check the auditor with offline fixtures
        run: python3 -B -m unittest discover -s tests -p 'test_portfolio_health.py' -v

  audit:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Inventory public repositories without changing them
        run: python3 -B scripts/portfolio_health.py --owner ult666666 --output-dir audit-output
      - name: Save dated machine-readable and human-readable reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-health-${{ github.run_id }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30
